[tox]
envlist = py{310,311,312,313}-dj52, py{312,313}-dj60, lint
isolated_build = true

[testenv]
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    pytest>=8.0
    pytest-django>=4.8
    django-tab-menus>=0.0.17
    make-html>=0.0.3
commands = pytest {posargs}
setenv =
    PYTHONPATH = {toxinidir}/src{:}{toxinidir}

[testenv:lint]
skip_install = true
deps = ruff
commands = ruff check src tests
