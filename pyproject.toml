[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-sitepulse"
version = "0.1.0"
description = "Self-hosted web analytics and request performance data, collected inside your Django project."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian", email = "ian@cobi.co.uk" }]
keywords = ["django", "analytics", "performance", "privacy", "cookieless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: Log Analysis",
]
dependencies = [
    "Django>=5.2",
    "user-agents>=2.2",
]

[project.optional-dependencies]
geoip = ["geoip2>=4.7"]
# The dashboard's navigation is built with MenuItem, and its charts with
# html_classes. There are no forms anywhere in it, so no modal library.
dashboard = [
    "django-tab-menus>=0.0.17",
    "make-html>=0.0.3",
]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/jonesim/django-sitepulse"
Issues = "https://github.com/jonesim/django-sitepulse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sitepulse = ["templates/sitepulse/*.html", "data/*.txt"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated by makemigrations; not ours to format.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
