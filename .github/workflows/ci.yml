name: tests

on: [push, pull_request]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.x needs Python 3.12+
          - python: "3.10"
            django: "6.0"
          - python: "3.11"
            django: "6.0"
          - python: "3.10"
            django: "6.1"
          - python: "3.11"
            django: "6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dashboard,test]" "Django~=${{ matrix.django }}.0"
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: sitepulse
          POSTGRES_DB: sitepulse_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dashboard,test]"
      # The partitioning, jsonb and percentile_cont paths only run here.
      - run: pytest -q
        env:
          SITEPULSE_TEST_DB: postgres
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: sitepulse
          PGDATABASE: sitepulse_test
